<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>भावछंद · घेई छंद मकरंद</title>
<meta name="description" content="भावछंद, poems by Makarand Joshi (घेई छंद मकरंद). 435 poems, 2024–2026.">
<meta name="color-scheme" content="light dark">
<style>
/* Layout concept: a reading room lit by a lamp. Motes of light drift over the title page; One compact title page (portrait + a verse to begin with),
   then a single explorer: choose by topic or by date, pick from the list, read on the right. */
:root{
  --paper:#f6f1e6; --paper-2:#efe7d6; --ink:#2d2a24; --ink-soft:#5f594d; --rule:#d9ceb6;
  --sage:#5f7155; --sage-soft:#b9c3ab; --sage-wash:#e3e8d9; --ochre:#9a7336; --shade:rgba(45,42,36,.05); --mote:165,125,63; --glow:rgba(165,125,63,.24); --mark:rgba(165,125,63,.22);
  color-scheme:light;
  --serif-latin:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --serif-deva:"Noto Serif Devanagari","Nirmala UI","Kohinoor Devanagari",Mangal,"Noto Sans Devanagari",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1a1915; --paper-2:#22201a; --ink:#e9e2d0; --ink-soft:#aca493; --rule:#3a372e;
    --sage:#a3b792; --sage-soft:#4a5842; --sage-wash:#2a3025; --ochre:#c9a467; --shade:rgba(255,255,255,.03); --mote:214,182,118; --glow:rgba(201,164,103,.20); --mark:rgba(201,164,103,.26);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1a1915; --paper-2:#22201a; --ink:#e9e2d0; --ink-soft:#aca493; --rule:#3a372e;
  --sage:#a3b792; --sage-soft:#4a5842; --sage-wash:#2a3025; --ochre:#c9a467; --shade:rgba(255,255,255,.03); --mote:214,182,118; --glow:rgba(201,164,103,.20); --mark:rgba(201,164,103,.26);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif-latin);line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1100px 460px at 50% -140px,var(--shade),transparent 70%);background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.wide{max-width:1040px;margin:0 auto}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

/* title page */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-top:clamp(36px,7vh,72px);padding-bottom:36px}
.id{display:flex;gap:40px;align-items:center;min-width:0}
.portrait{width:172px;max-width:100%;aspect-ratio:835/1600;flex:none;border-radius:18px;border:1px solid var(--rule);padding:6px;background:var(--paper-2)}
/* The whole photo, uncropped, in a soft-cornered frame */
.portrait .clip{width:100%;height:100%;border-radius:13px;overflow:hidden}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.inv-top{font-family:var(--serif-deva);color:var(--sage);font-size:14px;margin:0 0 8px}
.hero h1{font-family:var(--serif-deva);font-weight:400;font-size:clamp(44px,7vw,68px);line-height:1.15;margin:0}
.by{margin:8px 0 0;font-size:18px}
.by .pen{font-family:var(--serif-deva);color:var(--ink-soft);font-size:16px}
.meta{margin:12px 0 0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.feature{margin:0;border-left:1px solid var(--rule);padding:4px 0 4px 36px;min-width:0}
.feature .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin:0 0 12px}
.feature blockquote{margin:0;font-family:var(--serif-deva);font-size:clamp(17px,2.4vw,20px);line-height:1.95}
.feature blockquote p{margin:0}
.feature .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer;transition:border-color .2s,color .2s}
.pill:hover{border-color:var(--sage);color:var(--sage)}
.pill.solid{background:var(--sage);border-color:var(--sage);color:var(--paper)}
.pill.solid:hover{color:var(--paper);filter:brightness(1.08)}

/* explorer */
.explore{border-top:1px solid var(--rule);padding-top:22px;padding-bottom:40px}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--paper-2)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 18px;font-size:14px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.search{flex:1;min-width:180px;font-family:var(--serif-deva);font-size:16px;color:var(--ink);background:var(--paper-2);
  border:1px solid var(--rule);border-radius:999px;padding:8px 16px}
.search::placeholder{color:var(--ink-soft)}
.count{font-size:13px;color:var(--ink-soft);white-space:nowrap}

.topics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.chip{position:relative;text-align:left;border:1px solid var(--rule);border-radius:10px;background:transparent;padding:10px 12px 12px;cursor:pointer;min-width:0;
  transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--sage)}
.chip[aria-pressed="true"]{background:var(--sage-wash);border-color:var(--sage)}
.chip .mr{display:block;font-family:var(--serif-deva);font-size:18px;line-height:1.4}
.chip .en{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.3;min-height:2.6em}
.chip .n{display:block;font-size:12px;color:var(--ochre);margin-top:6px;font-variant-numeric:tabular-nums}
.chip .bar{position:absolute;left:12px;bottom:0;height:2px;background:var(--sage-soft);border-radius:2px}

.rhythm{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.rhythm[hidden],.topics[hidden]{display:none}
.yr{display:flex;flex-direction:column;gap:6px;flex:1 0 auto}
.yr .y{font-size:12px;letter-spacing:.1em;color:var(--ink-soft)}
.mos{display:flex;gap:4px;align-items:flex-end;height:84px}
.mo{width:28px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;background:transparent;border:0;padding:0;cursor:pointer}
.mo i{display:block;width:100%;background:var(--sage-soft);border-radius:3px 3px 0 0;min-height:2px;transition:background .2s}
.mo:hover i{background:var(--sage)}
.mo[aria-pressed="true"] i{background:var(--sage)}
.mo b{font-weight:400;font-size:11px;color:var(--ink-soft);line-height:1}
.mo[aria-pressed="true"] b{color:var(--ink)}
.mo[disabled]{cursor:default;opacity:.35}

.split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;height:600px;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.split > *,.topics > *{min-width:0}
.list{position:relative;overflow-y:auto;border-right:1px solid var(--rule);background:var(--paper)}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:11px 14px;cursor:pointer}
.item:hover{background:var(--paper-2)}
.item[aria-current="true"]{background:var(--sage-wash);box-shadow:inset 3px 0 0 var(--sage)}
.item .l1{display:block;font-family:var(--serif-deva);font-size:15.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l2{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.item .l2 em{font-style:normal;font-family:var(--serif-deva);color:var(--ochre);margin-right:8px}
.none{padding:30px 16px;text-align:center;color:var(--ink-soft)}

.reader{overflow-y:auto;padding:28px clamp(16px,4vw,48px) 28px;text-align:center;background:var(--paper)}
.rhead{display:flex;justify-content:center;align-items:baseline;gap:12px;margin-bottom:6px;color:var(--ink-soft)}
.rhead .num{font-family:var(--serif-deva);font-size:16px;color:var(--ochre)}
.rhead time{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tagrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.tag{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.tag:hover{border-color:var(--sage);color:var(--sage)}
.inv{font-family:var(--serif-deva);font-size:15px;color:var(--sage);margin:0 0 18px;line-height:1.7}
.stanza{margin:0 0 18px}
.stanza p{font-family:var(--serif-deva);font-size:clamp(17px,2.4vw,20px);line-height:2.05;margin:0}
.sig{font-family:var(--serif-deva);font-size:14px;color:var(--ink-soft);margin:22px 0 0}
.rnav{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.earlier{margin:22px auto 0;max-width:520px}
.earlier summary{cursor:pointer;list-style:none;font-size:13px;letter-spacing:.06em;color:var(--ink-soft);padding:8px 0;border-top:1px dashed var(--rule)}
.earlier summary::-webkit-details-marker{display:none}
.earlier summary::after{content:" +";color:var(--ochre)}
.earlier[open] summary::after{content:" \2212"}
.older{margin-top:14px;opacity:.85}
.older .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.older .stanza p{font-size:clamp(16px,2.2vw,18px);line-height:1.95}

footer{text-align:center;color:var(--ink-soft);font-size:13px;padding-bottom:48px}
footer p{margin:4px 0}
footer .deva{font-family:var(--serif-deva);color:var(--ink);font-size:15px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:26px}
  .feature{border-left:0;border-top:1px solid var(--rule);padding:22px 0 0}
  .topics{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:620px){
  .topics{grid-template-columns:repeat(2,1fr)}
  .id{gap:20px}.portrait{width:112px;padding:4px;border-radius:14px}.portrait .clip{border-radius:10px}
  .split{grid-template-columns:1fr;grid-template-rows:230px auto;height:auto}
  .list{border-right:0;border-bottom:1px solid var(--rule)}
  .reader{overflow:visible}
  .view{width:100%}.view button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3: language toggle, lamp-light, ink ---- */
.topline{display:flex;justify-content:flex-end;padding-top:16px;position:relative;z-index:2}
.lang button{padding:5px 14px;font-size:13px}
.lang .deva{font-family:var(--serif-deva)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.hero{position:relative;padding-top:clamp(20px,4vh,44px)}
.hero > *{position:relative;z-index:1}
#motes{position:absolute;z-index:0;top:-60px;left:0;width:100%;height:calc(100% + 60px);pointer-events:none}
.halo{position:relative;flex:none;display:grid;place-items:center}
.halo::before{content:"";position:absolute;inset:-26px;border-radius:40px;
  background:radial-gradient(circle,var(--glow) 0%,transparent 68%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.portrait{position:relative}
.ink{animation:ink .95s cubic-bezier(.2,.7,.2,1) both}
@keyframes ink{from{opacity:.12;filter:blur(3px);transform:translateY(5px)}to{opacity:1;filter:blur(0);transform:none}}
.reader.turn .rhead,.reader.turn .tagrow,.reader.turn .inv{animation:fadein .5s ease both}
.reader.turn .sig,.reader.turn .rnav{animation:fadein .6s ease .5s both}
@keyframes fadein{from{opacity:.15}to{opacity:1}}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.reader .stanza p{transition:color .35s}
.reader .stanza p:hover{color:var(--sage)}
.rhead .rev{font-size:12px}
/* Devanagari interface: Devanagari-first faces, and no letter-spacing (it breaks conjuncts) */
[data-ui="mr"] body,[data-ui="mr"] button,[data-ui="mr"] input{font-family:var(--serif-deva)}
[data-ui="mr"] .rhead time,[data-ui="mr"] .rhead .rev,[data-ui="mr"] .older .d,[data-ui="mr"] .feature .lbl,
[data-ui="mr"] .yr .y,[data-ui="mr"] .earlier summary{letter-spacing:0;text-transform:none}
[data-ui="mr"] .feature .lbl{font-size:14px}
[data-ui="mr"] .rhead time,[data-ui="mr"] .rhead .rev{font-size:13px}
@media (prefers-reduced-motion:reduce){.ink,.halo::before,.reader.turn *{animation:none!important}}
</style>
</head>

</div>

  var DIG = '०१२३४५६७८९';
  function mnum(n) { return String(n).replace(/\d/g, function (d) { return DIG[+d]; }); }
  function same(n) { return String(n); }

  /* ---------- interface text: Marathi only, or Marathi + English ---------- */
  var T = {
    mr: {
      num: mnum,
      months: ['जानेवारी', 'फेब्रुवारी', 'मार्च', 'एप्रिल', 'मे', 'जून', 'जुलै', 'ऑगस्ट', 'सप्टेंबर', 'ऑक्टोबर', 'नोव्हेंबर', 'डिसेंबर'],
      mi: ['जा', 'फे', 'मा', 'ए', 'मे', 'जू', 'जु', 'ऑ', 'स', 'ऑ', 'नो', 'डि'],
      name: 'मकरंद जोशी',
      today: 'आजचे कडवे', anotherLbl: 'आणखी एक कडवे',
      read: 'संपूर्ण कविता वाचा', another: 'दुसरे कडवे',
      byTopic: 'विषयानुसार', byDate: 'तारखेनुसार', browse: 'कविता कशा पाहायच्या',
      search: 'शब्द किंवा ओळ शोधा', searchLbl: 'कविता शोधा',
      poems: function (n) { return mnum(n) + ' कविता'; },
      allDesc: 'सर्व कविता',
      none: 'अशी कविता सापडली नाही.',
      newer: '‹ नवीन', older: 'जुनी ›', copy: 'कॉपी', copied: 'कॉपी झाली', copyFail: 'मजकूर निवडून कॉपी करा',
      revised: 'सुधारित',
      earlier: function (n) { return (n > 1 ? 'पूर्वीच्या आवृत्त्या' : 'पूर्वीची आवृत्ती') + ' (' + mnum(n) + ')'; },
      earlierOne: 'पूर्वीची आवृत्ती',
      list: 'कवितांची यादी',
      themeName: function (t) { return t.mr; },
      themeDesc: function (t) { return t.mrd; },
      tag: function (t) { return t.mr; }
    },
    mx: {
      num: same,
      months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      mi: ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'],
      name: 'Makarand Joshi',
      today: "Today's verse", anotherLbl: 'Another verse',
      read: 'Read the poem', another: 'Another verse',
      byTopic: 'By topic', byDate: 'By date', browse: 'Browse poems',
      search: 'Search a word or line', searchLbl: 'Search poems',
      poems: function (n) { return n + (n === 1 ? ' poem' : ' poems'); },
      allDesc: 'All poems',
      none: 'No poem matches.',
      newer: '‹ Newer', older: 'Older ›', copy: 'Copy', copied: 'Copied', copyFail: 'Select the text to copy',
      revised: 'revised',
      earlier: function (n) { return 'Earlier version' + (n > 1 ? 's' : '') + ' (' + n + ')'; },
      earlierOne: 'Earlier version',
      list: 'Poems',
      themeName: function (t) { return t.mr; },
      themeDesc: function (t) { return t.en; },
      tag: function (t) { return t.mr + ' · ' + t.en; }
    }
  };
  var lang = 'mr';
  try { var saved = localStorage.getItem('bhavchhand-ui'); if (saved === 'mx' || saved === 'mr') lang = saved; } catch (e) {}
  function L() { return T[lang]; }

  function fdate(iso) {
    var p = iso.split('-'), t = L();
    if (lang === 'mr') return t.num(+p[2]) + ' ' + t.months[+p[1] - 1] + ' ' + t.num(p[0]);
    return +p[2] + ' ' + t.months[+p[1] - 1].slice(0, 3) + ' ' + p[0];
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  /* a line of text with every match of the search term marked */
  function marked(tag, cls, text, q) {
    var e = el(tag, cls);
    if (!q) { e.textContent = text; return e; }
    var lo = text.toLowerCase(), i = 0, j;
    while ((j = lo.indexOf(q, i)) >= 0) {
      if (j > i) e.appendChild(document.createTextNode(text.slice(i, j)));
      e.appendChild(el('mark', null, text.slice(j, j + q.length)));
      i = j + q.length;
    }
    if (i < text.length) e.appendChild(document.createTextNode(text.slice(i)));
    return e;
  }
  function flat(s) { return s.map(function (st) { return st.join(' '); }).join(' '); }
  DATA.forEach(function (p) {
    p.text = (flat(p.s) + ' ' + p.e.map(function (e) { return flat(e.s); }).join(' ')).toLowerCase();
  });

  var st = { view: 'topic', topic: null, month: null, q: '', cur: DATA[0].n };
  function term() { return st.q.trim().toLowerCase(); }

  function filtered() {
    var q = term();
    return DATA.filter(function (p) {
      if (st.view === 'topic' && st.topic && p.t.indexOf(st.topic) < 0) return false;
      if (st.view === 'date' && st.month && p.d.slice(0, 7) !== st.month) return false;
      if (q && p.text.indexOf(q) < 0) return false;
      return true;
    });
  }

  /* ---------- static labels ---------- */
  function applyStatic() {
    var t = L();
    document.documentElement.setAttribute('data-ui', lang);
    [].forEach.call(document.querySelectorAll('[data-t]'), function (n) { n.textContent = t[n.getAttribute('data-t')]; });
    [].forEach.call(document.querySelectorAll('[data-tp]'), function (n) { n.setAttribute('placeholder', t[n.getAttribute('data-tp')]); });
    [].forEach.call(document.querySelectorAll('[data-ta]'), function (n) { n.setAttribute('aria-label', t[n.getAttribute('data-ta')]); });
    var img = document.querySelector('.portrait img'); if (img) img.alt = t.name;
    [].forEach.call(document.querySelectorAll('.lang button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === lang)); });
  }

  /* ---------- topics ---------- */
  var topicsBox = $('topics');
  var counts = {};
  THEMES.forEach(function (t) { counts[t.k] = DATA.filter(function (p) { return p.t.indexOf(t.k) >= 0; }).length; });
  var maxC = Math.max.apply(null, THEMES.map(function (t) { return counts[t.k]; }));
  function buildTopics() {
    var t = L();
    topicsBox.textContent = '';
    var all = el('button', 'chip'); all.type = 'button'; all.dataset.k = '';
    all.appendChild(el('span', 'mr', 'सर्व')); all.appendChild(el('span', 'en', t.allDesc));
    all.appendChild(el('span', 'n', t.poems(DATA.length)));
    topicsBox.appendChild(all);
    THEMES.forEach(function (th) {
      var b = el('button', 'chip'); b.type = 'button'; b.dataset.k = th.k;
      b.appendChild(el('span', 'mr', t.themeName(th))); b.appendChild(el('span', 'en', t.themeDesc(th)));
      b.appendChild(el('span', 'n', t.poems(counts[th.k])));
      var bar = el('span', 'bar'); bar.style.width = 'calc((100% - 24px) * ' + (counts[th.k] / maxC).toFixed(3) + ')';
      b.appendChild(bar);
      topicsBox.appendChild(b);
    });
  }
  topicsBox.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    st.topic = b.dataset.k || null; refresh(true);
  });

  /* ---------- rhythm by month ---------- */
  var rhythm = $('rhythm');
  var perMonth = {};
  DATA.forEach(function (p) { var k = p.d.slice(0, 7); perMonth[k] = (perMonth[k] || 0) + 1; });
  var keys = Object.keys(perMonth).sort();
  var maxM = Math.max.apply(null, keys.map(function (k) { return perMonth[k]; }));
  function buildRhythm() {
    var t = L();
    rhythm.textContent = '';
    var y0 = +keys[0].slice(0, 4), y1 = +keys[keys.length - 1].slice(0, 4);
    for (var y = y0; y <= y1; y++) {
      var wrap = el('div', 'yr'); wrap.appendChild(el('span', 'y', t.num(y)));
      var mos = el('div', 'mos');
      for (var m = 1; m <= 12; m++) {
        var key = y + '-' + (m < 10 ? '0' + m : m);
        var c = perMonth[key] || 0;
        if (!c && ((y === y0 && key < keys[0]) || (y === y1 && key > keys[keys.length - 1]))) continue;
        var b = el('button', 'mo'); b.type = 'button'; b.dataset.m = key;
        b.title = t.months[m - 1] + ' ' + t.num(y) + ' · ' + t.poems(c);
        b.setAttribute('aria-label', b.title);
        if (!c) b.disabled = true;
        var i = el('i'); i.style.height = (c ? Math.max(6, c / maxM * 62) : 2) + 'px';
        b.appendChild(i); b.appendChild(el('b', null, t.mi[m - 1]));
        mos.appendChild(b);
      }
      wrap.appendChild(mos); rhythm.appendChild(wrap);
    }
  }
  rhythm.addEventListener('click', function (e) {
    var b = e.target.closest('.mo'); if (!b || b.disabled) return;
    st.month = (st.month === b.dataset.m) ? null : b.dataset.m; refresh(true);
  });

  /* ---------- list ---------- */
  var list = $('list'), reader = $('reader'), countEl = $('count');
  function firstHit(p, q) {
    if (!q) return p.s[0][0];
    for (var a = 0; a < p.s.length; a++) for (var b = 0; b < p.s[a].length; b++) {
      if (p.s[a][b].toLowerCase().indexOf(q) >= 0) return p.s[a][b];
    }
    return p.s[0][0];
  }
  function renderList(items) {
    var t = L(), q = term();
    list.textContent = '';
    if (!items.length) { list.appendChild(el('div', 'none', t.none)); return; }
    var frag = document.createDocumentFragment();
    items.forEach(function (p) {
      var b = el('button', 'item'); b.type = 'button'; b.dataset.n = p.n;
      b.appendChild(marked('span', 'l1', firstHit(p, q), q));
      var l2 = el('span', 'l2'); l2.appendChild(el('em', null, mnum(p.n)));
      l2.appendChild(document.createTextNode(fdate(p.d)));
      b.appendChild(l2);
      if (p.n === st.cur) b.setAttribute('aria-current', 'true');
      frag.appendChild(b);
    });
    list.appendChild(frag);
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('.item'); if (!b) return; select(+b.dataset.n);
  });

  /* ---------- reader ---------- */
  function stanzasEl(sts, q, ink) {
    var f = document.createDocumentFragment(), k = 0;
    sts.forEach(function (s) {
      var d = el('div', 'stanza');
      s.forEach(function (l) {
        var p = marked('p', ink ? 'ink' : null, l, q);
        if (ink) p.style.animationDelay = Math.min(k++ * 70, 1400) + 'ms';
        d.appendChild(p);
      });
      f.appendChild(d);
    });
    return f;
  }

  function renderReader(p) {
    var t = L(), q = term();
    reader.textContent = '';
    var h = el('div', 'rhead'); h.appendChild(el('span', 'num', mnum(p.n)));
    var tm = el('time', null, fdate(p.d)); tm.setAttribute('datetime', p.d); h.appendChild(tm);
    if (p.r) h.appendChild(el('span', 'rev', '· ' + t.revised + ' ' + fdate(p.r)));
    reader.appendChild(h);
    var tr = el('div', 'tagrow');
    p.t.forEach(function (k) {
      var b = el('button', 'tag', t.tag(TN[k])); b.type = 'button'; b.dataset.k = k; tr.appendChild(b);
    });
    reader.appendChild(tr);
    if (p.inv) reader.appendChild(el('p', 'inv', p.inv));
    reader.appendChild(stanzasEl(p.s, q, true));
    if (p.g) reader.appendChild(el('p', 'sig', p.g));
    var nav = el('div', 'rnav');
    var prev = el('button', 'pill', t.newer), next = el('button', 'pill', t.older), cp = el('button', 'pill', t.copy);
    prev.type = next.type = cp.type = 'button';
    prev.dataset.act = 'prev'; next.dataset.act = 'next'; cp.dataset.act = 'copy';
    nav.appendChild(prev); nav.appendChild(cp); nav.appendChild(next);
    reader.appendChild(nav);
    if (p.e.length) {
      var d = el('details', 'earlier');
      d.appendChild(el('summary', null, t.earlier(p.e.length)));
      p.e.forEach(function (e) {
        var o = el('div', 'older'); o.appendChild(el('p', 'd', t.earlierOne + ' · ' + fdate(e.d)));
        o.appendChild(stanzasEl(e.s, q, false)); d.appendChild(o);
      });
      reader.appendChild(d);
    }
    reader.scrollTop = 0;
    reader.classList.remove('turn'); void reader.offsetWidth; reader.classList.add('turn');
  }

  function select(n) {
    st.cur = n;
    renderReader(byN[n]);
    var cur = list.querySelector('[aria-current]'); if (cur) cur.removeAttribute('aria-current');
    var it = list.querySelector('.item[data-n="' + n + '"]');
    if (it) {
      it.setAttribute('aria-current', 'true');
      if (it.offsetTop < list.scrollTop || it.offsetTop + it.offsetHeight > list.scrollTop + list.clientHeight) {
        list.scrollTop = it.offsetTop - (list.clientHeight - it.offsetHeight) / 2;
      }
    }
    try { history.replaceState(null, '', '#p' + n); } catch (e) {}
  }

  function step(dir) {
    var items = filtered(); if (!items.length) return;
    var i = items.findIndex(function (p) { return p.n === st.cur; });
    i = i < 0 ? 0 : (i + dir + items.length) % items.length;
    select(items[i].n);
  }

  reader.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]'), tg = e.target.closest('.tag');
    if (tg) {
      st.view = 'topic'; st.topic = tg.dataset.k; st.q = ''; $('q').value = '';
      refresh(true); $('explore').scrollIntoView({ block: 'start' }); return;
    }
    if (!a) return;
    if (a.dataset.act === 'prev') step(-1);
    else if (a.dataset.act === 'next') step(1);
    else if (a.dataset.act === 'copy') {
      var t = L(), p = byN[st.cur];
      var txt = (p.inv ? p.inv + '\n' : '') + p.s.map(function (s) { return s.join('\n'); }).join('\n\n') + (p.g ? '\n' + p.g : '');
      var done = function (m) { a.textContent = m; setTimeout(function () { a.textContent = L().copy; }, 1400); };
      try { navigator.clipboard.writeText(txt).then(function () { done(t.copied); }, function () { done(t.copyFail); }); }
      catch (err) { done(t.copyFail); }
    }
  });

  function refresh(pick) {
    var t = L(), items = filtered();
    topicsBox.hidden = st.view !== 'topic';
    rhythm.hidden = st.view !== 'date';
    [].forEach.call(topicsBox.children, function (b) { b.setAttribute('aria-pressed', String((b.dataset.k || null) === st.topic)); });
    [].forEach.call(rhythm.querySelectorAll('.mo'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.m === st.month)); });
    [].forEach.call(document.querySelectorAll('.view button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === st.view)); });
    var label = t.poems(items.length);
    if (st.view === 'topic' && st.topic) label += ' · ' + t.themeName(TN[st.topic]);
    if (st.view === 'date' && st.month) { var p = st.month.split('-'); label += ' · ' + t.months[+p[1] - 1] + ' ' + t.num(p[0]); }
    countEl.textContent = label;
    if (pick && items.length && !items.some(function (p) { return p.n === st.cur; })) st.cur = items[0].n;
    renderList(items);
    if (items.length) {
      renderReader(byN[st.cur]);
      var it = list.querySelector('[aria-current]'); if (it) list.scrollTop = Math.max(0, it.offsetTop - 80);
    } else reader.textContent = '';
  }

  document.querySelector('.view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; st.view = b.dataset.v; refresh(true);
  });
  $('q').addEventListener('input', function () { st.q = this.value; refresh(true); });
  document.addEventListener('keydown', function (e) {
    var tn = e.target.tagName;
    if (tn === 'INPUT' || tn === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
  });

  /* ---------- today's verse: the same verse for everyone on a given day ---------- */
  var feat = $('feat'), featLbl = $('featLbl');
  var dayNo = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  var featN = DATA[dayNo % DATA.length].n, featDaily = true;
  function renderFeature() {
    var p = byN[featN];
    feat.textContent = '';
    featLbl.textContent = featDaily ? L().today : L().anotherLbl;
    p.s[0].slice(0, 4).forEach(function (l, k) {
      var e = el('p', 'ink', l); e.style.animationDelay = (k * 140) + 'ms'; feat.appendChild(e);
    });
  }
  $('another').addEventListener('click', function () {
    var p; do { p = DATA[Math.floor(Math.random() * DATA.length)]; } while (p.n === featN && DATA.length > 1);
    featN = p.n; featDaily = false; renderFeature();
  });
  $('readit').addEventListener('click', function () {
    st.view = 'topic'; st.topic = null; st.month = null; st.q = ''; $('q').value = '';
    st.cur = featN; refresh(false); select(featN);
    $('explore').scrollIntoView({ block: 'start' });
  });

  /* ---------- language toggle ---------- */
  function renderAll() {
    applyStatic(); buildTopics(); buildRhythm(); renderFeature(); refresh(false);
  }
  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.dataset.l === lang) return;
    lang = b.dataset.l;
    try { localStorage.setItem('bhavchhand-ui', lang); } catch (err) {}
    renderAll();
  });

  var m = /^#p(\d+)$/.exec(location.hash || '');
  if (m && byN[+m[1]]) st.cur = +m[1];
  renderAll();

  /* ---------- drifting motes of light behind the title page ---------- */
  (function motes() {
    var c = $('motes');
    if (!c || !c.getContext) return;
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) { c.hidden = true; return; }
    var ctx = c.getContext('2d'), W = 0, H = 0, P = [], raf = 0, col = '165,125,63';
    function readCol() {
      var v = getComputedStyle(document.documentElement).getPropertyValue('--mote').trim();
      if (/^\d+\s*,\s*\d+\s*,\s*\d+$/.test(v)) col = v;
    }
    function size() {
      var r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      W = r.width; H = r.height; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function spawn(p, init) {
      p.x = Math.random() * W; p.y = init ? Math.random() * H : H + 8;
      p.r = 0.6 + Math.random() * 1.7; p.vy = 0.06 + Math.random() * 0.2;
      p.ph = Math.random() * 6.283; p.a = 0.18 + Math.random() * 0.5;
    }
    size(); readCol();
    for (var i = 0; i < 30; i++) { var p = {}; spawn(p, true); P.push(p); }
    function tick(t) {
      ctx.clearRect(0, 0, W, H);
      for (var k = 0; k < P.length; k++) {
        var q = P[k];
        q.y -= q.vy; q.x += Math.sin(t / 2600 + q.ph) * 0.14;
        if (q.y < -8) spawn(q, false);
        var tw = 0.5 + 0.5 * Math.sin(t / 1100 + q.ph * 3);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + col + ',' + (q.a * tw).toFixed(3) + ')';
        ctx.shadowColor = 'rgba(' + col + ',.7)'; ctx.shadowBlur = 8;
        ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    window.addEventListener('resize', size);
    document.addEventListener('visibilitychange', function () {
      cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(tick);
    });
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readCol); } catch (e) {}
    try { new MutationObserver(readCol).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  })();
})();
</script>
